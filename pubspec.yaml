name: personal_trainer_mobile
description: "A lean Flutter Clean Architecture starter for Material apps."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.1
  get_it: ^9.2.1
  go_router: ^17.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/splash_icon1.png
  color_dark: "#121212"
  image_dark: assets/icons/splash_icon1.png
  android_12:
    color: "#ffffff"
    image: assets/icons/splash_icon1.png

    color_dark: "#121212"
    image_dark: assets/icons/splash_icon1.png

    icon_background_color: "#ffffff"
    icon_background_color_dark: "#121212"